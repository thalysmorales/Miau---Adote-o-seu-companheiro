    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="  https://miau-adote-seu-companheiro.netlify.app/styles.css">
    <title>Novo Cadastro</title>
</head>

<body>
    <nav>
        <ul class="nav">
            <div class="inicio">
                <li class="nav-item">
                    <img class="logoOfc" src="  https://miau-adote-seu-companheiro.netlify.app/img/logoofc.png"
                        alt="Logo do web site- MiAu">
                </li>
            </div>
            <div class="fim fimMA">
                <li class="nav-item">
                    <a href="index.html"><button>Sair</button></a>
                </li>
            </div>
        </ul>

    </nav>

    <main>
        <div class="MA">
            <div class="esquerdaMA">
                <div class="topoMAesq">
                    <img src="  https://miau-adote-seu-companheiro.netlify.app/img/LogoSoPatas.png"
                        alt="Logo da ONG Só Patas">
                    <h5>Só Patas</h5>
                    <p>Admin</p>
                </div>
                <div class="fimMAesq">
                    <a href="meusAnimais.html"><button class="botaoMA2"><i class="bi bi-columns-gap"></i>Meus
                            Animais</button></a>
                    <a href="#"><button class="botaoMA2 ativo"><i class="bi bi-plus-circle"></i>Novo
                            Cadastro</button></a>
                </div>
            </div>
            <div class="direitaMA">
                <h1>Novo Cadastro</h1>
                <form class="formMA" id="formCadastro">

    <div class="divFormMA">
        <div>
            <div class="divElementosForm">
                <label for="nome">Nome do Pet</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Bob" required>
            </div>
            <div class="divElementosForm">
                <label for="especie">Espécie</label>
                <select id="especie" name="especie" required>
                    <option value="" disabled selected hidden>Selecione a espécie</option>
                    <option value="cachorro">Cachorro</option>
                    <option value="gato">Gato</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            <div class="divElementosForm">
                <label for="porte">Porte</label>
                <select id="porte" name="porte" required>
                    <option value="" disabled selected hidden>Selecione o porte</option>
                    <option value="pequeno">Pequeno</option>
                    <option value="medio">Médio</option>
                    <option value="grande">Grande</option>
                </select>
            </div>
            <div class="divElementosForm">
                <label for="vacinado">Vacinado?</label>
                <select id="vacinado" name="vacinado" required>
                    <option value="" disabled selected hidden>Selecione</option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                </select>
            </div>
            <div class="divElementosForm">
                <label for="vermifugado">Vermifugado?</label>
                <select id="vermifugado" name="vermifugado" required>
                    <option value="" disabled selected hidden>Selecione</option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                </select>
            </div>
        </div>

        <div>
            <div class="divElementosForm">
                <label for="raca">Raça</label>
                <input type="text" id="raca" name="raca" placeholder="Ex: Vira-lata (SRD)">
            </div>
            <div class="divElementosForm">
                <label for="genero">Gênero</label>
                <select id="genero" name="genero" required>
                    <option value="" disabled selected hidden>Selecione o gênero</option>
                    <option value="macho">Macho</option>
                    <option value="femea">Fêmea</option>
                </select>
            </div>
            <div class="divElementosForm">
                <label for="idade">Idade Estimada</label>
                <select id="idade" name="idade" required>
                    <option value="" disabled selected hidden>Selecione a idade estimada</option>
                    <option value="filhote">Filhote</option>
                    <option value="adulto">Adulto</option>
                    <option value="idoso">Idoso</option>
                </select>
            </div>
            <div class="divElementosForm">
                <label for="castrado">Castrado?</label>
                <select id="castrado" name="castrado" required>
                    <option value="" disabled selected hidden>Selecione</option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                </select>
            </div>
        </div>
    </div>

    <div class="divElementosForm">
        <label for="personalidade">Personalidade e História</label>
        <textarea id="personalidade" name="personalidade" required
            placeholder="Descreva o temperamento do animal e um pouco da sua história..."></textarea>
    </div>

    <div class="divElementosForm" id="blocoFotos">
        <label for="fotos" class="campoLabel">Fotos (até 4)</label>

        <label for="fotos" class="caixaUpload" id="caixaUpload">
            <i class="bi bi-plus-circle"></i>
            <span id="textoUpload">Clique para adicionar fotos</span>
        </label>
        <input type="file" id="fotos" name="fotos" accept="image/*" multiple hidden>

        <div id="previas" class="previas"></div>
        <p id="avisoFotos" class="avisoFotos" hidden></p>
    </div>

    <button type="submit">Cadastrar Pet</button>
    <p id="mensagemForm" class="mensagemForm" hidden></p>
</form>

            </div>
        </div>
    </main>
    <footer class="rodape">

        <div class="item-rodape">
            <img class="logoOfc" src="  https://miau-adote-seu-companheiro.netlify.app/img/logoofc.png"
                alt="Logo do web site- MiAu">
            <p>Seu novo melhor amigo está a um clique!</p>
            <div>
                <i class="bi bi-camera i-rodape"></i>
                <i class="bi bi-envelope i-rodape"></i>
            </div>
            <div class="pRo">
                <p class="p-rodape"><i class="bi bi-c-circle"></i> 2026 MiAu - Centro Universitário UNIPAM</p>
            </div>
    </footer>
       <script src="../js/dados.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="novoCadastro.js"></script>
</body>

</html>
