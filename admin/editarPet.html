<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://miau-adote-seu-companheiro.netlify.app/styles.css">
    <title>Editar Pet</title>
</head>

<body>
    <nav>
        <ul class="nav">
            <div class="inicio">
                <li class="nav-item">
                    <img class="logoOfc" src="https://miau-adote-seu-companheiro.netlify.app/img/logoofc.png"
                        alt="Logo do web site- MiAu">
                </li>
            </div>
            <div class="fim fimMA">
                <li class="nav-item">
                    <a href="login.html"><button>Sair</button></a>
                </li>
            </div>
        </ul>

    </nav>

    <main>
        <div class="MA">
            <div class="esquerdaMA">
                <div class="topoMAesq">
                    <img src="https://miau-adote-seu-companheiro.netlify.app/img/LogoSoPatas.png"
                        alt="Logo da ONG Só Patas">
                    <h5>Só Patas</h5>
                    <p>Admin</p>
                </div>
                <div class="fimMAesq">
                    <a href="meusAnimais.html"><button><i class="bi bi-columns-gap"></i>Meus Animais</button></a>
                    <a href="novoCadastro.html"><button class="botaoMA2"><i class="bi bi-plus-circle"></i>Novo
                            Cadastro</button></a>
                </div>
            </div>
            <div class="direitaMA">
                <h1 id="tituloEdicao">Editar Pet</h1>
                <form class="formMA" id="formEditar">
                    <div class="divFormMA">
                        <div>
                            <div class="divElementosForm">
                                <label for="nome">Nome do Pet</label>
                                <input type="text" id="nome" name="nome" placeholder="Ex: Bob" required>
                            </div>
                            <div class="divElementosForm">
                                <label for="especie">Espécie</label>
                                <select id="especie" name="especie" required>
                                    <option value="" disabled selected hidden>Selecione a espécie</option>
                                    <option value="Cachorro">Cachorro</option>
                                    <option value="Gato">Gato</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            <div class="divElementosForm">
                                <label for="genero">Gênero</label>
                                <select id="genero" name="genero" required>
                                    <option value="" disabled selected hidden>Selecione o gênero</option>
                                    <option value="Macho">Macho</option>
                                    <option value="Fêmea">Fêmea</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <div class="divElementosForm">
                                <label for="raca">Raça</label>
                                <input type="text" id="raca" name="raca" placeholder="Ex: SRD">
                            </div>
                            <div class="divElementosForm">
                                <label for="idade">Idade Estimada</label>
                                <select id="idade" name="idade" required>
                                    <option value="" disabled selected hidden>Selecione a idade estimada</option>
                                    <option value="Filhote">Filhote</option>
                                    <option value="Adulto">Adulto</option>
                                    <option value="Idoso">Idoso</option>
                                </select>
                            </div>
                            <div class="divElementosForm">
                                <label for="porte">Porte</label>
                                <select id="porte" name="porte" required>
                                    <option value="" disabled selected hidden>Selecione o porte</option>
                                    <option value="Pequeno">Pequeno</option>
                                    <option value="Médio">Médio</option>
                                    <option value="Grande">Grande</option>
                                </select>
                            </div>
                            <div class="divElementosForm">
                                <label>Saúde</label>
                                <div>
                                    <label><input type="checkbox" id="vacinado" name="vacinado"> Vacinado</label>
                                    <label><input type="checkbox" id="castrado" name="castrado"> Castrado</label>
                                    <label><input type="checkbox" id="vermifugado" name="vermifugado"> Vermifugado</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="divElementosForm">
                        <label for="descricao">Personalidade e História</label>
                        <textarea id="descricao" name="descricao"
                            placeholder="Descreva o temperamento do animal e um pouco da sua história..."></textarea>
                    </div>
                    <div class="divElementosForm">
                        <label for="fotos" class="campoLabel">Fotos (até 4)</label>

                        <label for="fotos" class="caixaUpload" id="caixaUpload">
                            <i class="bi bi-plus-circle"></i>
                            <span id="textoUpload">Clique para adicionar fotos</span>
                        </label>
                        <input type="file" id="fotos" name="fotos" accept="image/*" multiple hidden>

                        <div id="previas" class="previas"></div>
                        <p id="avisoFotos" class="avisoFotos" hidden></p>
                    </div>

                    <p id="mensagemForm" class="mensagemForm" hidden></p>
                    <button type="submit" id="botaoSalvar"> Salvar alterações </button>
                    <p><a href="meusAnimais.html">Cancelar e voltar para Meus Animais</a></p>
                </form>
            </div>
        </div>
    </main>
    <footer class="rodape">

        <div class="item-rodape">
            <img class="logoOfc" src="https://miau-adote-seu-companheiro.netlify.app/img/logoofc.png"
                alt="Logo do web site- MiAu">
            <p>Seu novo melhor amigo está a um clique!</p>
            <div>
                <i class="bi bi-camera i-rodape"></i>
                <i class="bi bi-envelope i-rodape"></i>
            </div>
            <div class="pRo">
                <p class="p-rodape"><i class="bi bi-c-circle"></i> 2026 MiAu - Centro Universitário UNIPAM</p>
            </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="editarPet.js"></script>
</body>

</html>
