<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiAu - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos embutidos: funcionam mesmo se o styles.css estiver em outra pasta -->
  <style>
    :root {
      --botao: #ff6b60;
      --texto: #222222;
      --borda: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: "Quicksand", system-ui, sans-serif;
      color: var(--texto);
    }

    .login {
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 52px;
    }

    .logo {
      width: 160px;
      max-width: 60%;
      height: auto;
      display: block;
    }

    .login-form {
      width: 100%;
      max-width: 212px;
      display: flex;
      flex-direction: column;
    }

    .login-form label {
      margin: 0 0 4px 5px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .login-form input {
      width: 100%;
      height: 36px;
      margin-bottom: 12px;
      padding: 0 10px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-size: 0.9rem;
    }

    .login-form input:focus {
      outline: 2px solid var(--botao);
      outline-offset: 1px;
    }

    .login-form button {
      align-self: center;
      margin-top: 14px;
      padding: 6px 18px;
      border: none;
      border-radius: 6px;
      background: var(--botao);
      color: #fff;
      font: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
      transition: filter 0.15s;
    }

    .login-form button:hover {
      filter: brightness(0.95);
    }

    .login-form button:focus-visible {
      outline: 2px solid var(--texto);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="login">
    <!-- Se a logo não aparecer, ajuste o caminho do src (ex.: img/logoofc.png) -->
    <img class="logo" src="html/img/logoofc copy.png" alt="MiAu">

    <form class="login-form" action="#" method="post">
      <label for="login">Login</label>
      <input type="text" id="login" name="login" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
