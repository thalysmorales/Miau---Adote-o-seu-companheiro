<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Novo Cadastro</title>
</head>

<body>
    <nav>
        <ul class="nav">
            <div class="inicio">
                <li class="nav-item">
                    <img class="logoOfc" src="img/logoofc.png" alt="Logo do web site- MiAu">
                </li>
            </div>
            <div class="fim fimMA">
                <li class="nav-item">
                    <a href="login.html"><button>Sair</button></a>
                </li>
            </div>
        </ul>

    </nav>

    <main>
        <div class="MA">
            <div class="esquerdaMA">
                <div class="topoMAesq">
                    <img src="img/LogoSoPatas.png" alt="Logo da ONG Só Patas">
                    <h5>Só Patas</h5>
                    <p>Admin</p>
                </div>
                <div class="fimMAesq">
                    <a href="meusAnimais.html"><button class="botaoMA2"><i class="bi bi-columns-gap"></i>Meus
                            Animais</button></a>
                    <a href="#"><button class="botaoMA2 ativo"><i class="bi bi-plus-circle"></i>Novo
                            Cadastro</button></a>
                </div>
            </div>
            <div class="direitaMA">
                <h1>Novo Cadastro</h1>
                <form>
                    <div>
                        <div>
                            <div>
                                <label>Nome do Pet</label>
                                <input type="text">
                            </div>
                            <div>
                                <label>Cor </label>
                                <input type="text">
                            </div>
                            <div>
                                <label>Espécie</label>
                                <input type="text">
                            </div>
                        </div>
                        <div>
                            <div>
                                <label> Raça</label>
                                <input type="text">
                            </div>
                            <div>
                                <label>Idade Estimada</label>
                                <input type="text">
                            </div>
                            <div>
                                <label>Porte</label>
                                <input type="text">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label for="">Personalidade e História</label>
                        <textarea name="" id=""></textarea>
                    </div>
                    <div>
                        <label for="fotos" class="campoLabel">Fotos (Upload)</label>

                        <label for="fotos" class="caixaUpload">
                            <i class="bi bi-plus-circle"></i>
                            <span>Clique para adicionar fotos</span>
                        </label>
                        <input type="file" id="fotos" name="fotos" accept="image/*" multiple hidden>
                        <div id="previas" class="previas"></div>
                    </div>

                    <button type="submit"> Cadastrar Pet </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="novoCadastro.js"></script>
</body>

</html>
